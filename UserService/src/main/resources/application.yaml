spring:
  datasource:
   url: jdbc:mysql://localhost:3306/user-service?useSSL=false&serverTimezone=UTC
   username: root
   password: password
   driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
   hibernate:
    ddl-auto: validate
   show-sql : true
  flyway:
   enabled: true
   locations: classpath:db/migration
   baseline-on-migrate: true
   validate-on-migrate: true
   clean-disabled: true
   out-of-order: false
  application:
    name: UserService
